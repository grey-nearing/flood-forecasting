# How to install:
# conda env create -f environments/environment_cpu.yml

name: openhydronet
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.*
  - pytorch>=2.5=*cpu*
  - absl-py=2.3.*
  - cachey=0.2.*
  - dask=2025.12.*
  - fsspec
  - gcsfs=2025.12.*
  - geopandas=1.1.*
  - google-cloud-storage
  - h5netcdf=1.7.*
  - h5py=3.15.*
  - icechunk=2.*  # dynamical.org forecast stores (multimet.weather_fetcher)
  - ipython
  - jupyter
  - libprotobuf
  - matplotlib=3.10.*
  - more-itertools=10.8.*
  - netcdf4=1.7.*
  - numpy=2.4.*
  - orc
  - pandas=2.3.*
  - pyarrow
  - pydantic=2.12.*
  - pyogrio
  - pyproj
  - pystac=1.*  # dynamical.org STAC catalog (multimet.weather_fetcher)
  - pytest
  - pytest-cov
  - pytest-xdist
  - python-eccodes=2.*  # GRIB2 decoding of ECMWF Open Data (import eccodes)
  - rasterio=1.5.*
  - requests
  - ruamel.yaml=0.18.*
  - ruff
  - scipy=1.16.*
  - shapely=2.1.*
  - tensorboard=2.20.*
  - tqdm=4.67.*
  - xarray=2025.12.*
  - zarr=3.1.*
